<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest Rate Calculator</title>
  <meta name="description" content="Use this free Interest Rate Calculator to calculate simple interest and the total amount payable.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="calculator__header">
      <p class="eyebrow">Personal finance tool</p>
      <h1>Interest Rate Calculator</h1>
      <p class="intro">Calculate simple interest and the total amount payable.</p>
    </header>

    <form id="interest-form" class="calculator__form" novalidate>
      <div class="form-field">
        <label for="principal">Principal amount</label>
        <div class="input-wrap">
          <span aria-hidden="true">$</span>
          <input type="number" id="principal" name="principal" min="0" step="0.01" value="1000" required>
        </div>
      </div>

      <div class="form-field">
        <label for="rate">Annual interest rate (%)</label>
        <div class="input-wrap">
          <input type="number" id="rate" name="rate" min="0" step="0.01" value="5" required>
          <span aria-hidden="true">%</span>
        </div>
      </div>

      <div class="form-field">
        <label for="time">Time (years)</label>
        <input type="number" id="time" name="time" min="0" step="0.01" value="1" required>
      </div>

      <button type="button" id="calculate-button">Calculate interest</button>
    </form>

    <section class="results" aria-live="polite" aria-atomic="true">
      <h2>Calculation results</h2>
      <div id="result" class="results__content">
        <p>Enter your values and select <strong>Calculate interest</strong>.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
